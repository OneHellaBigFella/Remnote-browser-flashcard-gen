<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css">
<style>body{width:auto;max-width:560px;margin:auto;padding:16px}label{display:block;margin-top:12px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:6px}textarea{height:70px}</style></head>
<body><h1>Flashcard Generator options</h1>
<label>Anthropic API key (stored only in this browser, sent only to api.anthropic.com)<input id="apiKey" type="password" autocomplete="off"></label>
<label>Model<select id="model"><option value="claude-opus-5-5">Claude Opus 5.5 (best)</option><option value="claude-sonnet-5-5">Claude Sonnet 5.5</option><option value="claude-haiku-5-5">Claude Haiku 5.5 (cheapest)</option></select></label>
<label>Effort<select id="effort"><option>low</option><option>medium</option><option>high</option></select></label>
<label>Max concept clusters per page<input id="maxClusters" type="number" min="1" max="12"></label>
<label>RemNote pairing token (RemNote → Settings → Plugins → Flashcard Generator Importer)<input id="pairingToken" autocomplete="off"></label>
<label>Auto-generate on these domains (one per line; empty = click only)<textarea id="autoDomains"></textarea></label>
<label><input id="openRemNote" type="checkbox" style="width:auto"> Open RemNote in a background tab to flush the queue if it isn't open</label>
<div class="row"><button class="primary" id="save">Save</button><span id="saved" class="muted"></span></div>
<script src="options.js"></script></body></html>
