name = "rfg-inbox"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Create with: npx wrangler kv namespace create INBOX   then paste the id below
[[kv_namespaces]]
binding = "INBOX"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MODEL = "claude-sonnet-5-5"
MAX_CLUSTERS = "5"
SUBMITS_PER_HOUR = "60"
# Secrets (set with `npx wrangler secret put NAME`): ANTHROPIC_API_KEY, SUBMIT_TOKEN, PULL_TOKEN
